    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23C83226'/><text x='50%' y='68%' font-size='54' font-weight='bold' text-anchor='middle' fill='%23F5EFE6' font-family='serif'>AJ</text></svg>" />

    <style>
      body {
        margin: 0;
        background-color: #08090C;
        color: #F5EFE6;
      }
      .initial-boot-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse 75% 65% at 50% 50%, #101218 0%, #07080B 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 9999;
        overflow: hidden;
        font-family: monospace;
      }
      .boot-enso-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-enso-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(245, 239, 230, 0.1);
        border-top-color: #C83226;
        border-right-color: rgba(200, 50, 38, 0.45);
        animation: bootSpin 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .boot-seal {
        width: 46px;
        height: 46px;
        border: 1.5px solid #C83226;
        background: rgba(200, 50, 38, 0.12);
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #F5EFE6;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.08em;
        box-shadow: 0 0 24px rgba(200, 50, 38, 0.35);
      }
      .boot-label {
        font-size: 11px;
        letter-spacing: 0.28em;
        color: #C8C0B2;
        text-transform: uppercase;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-boot-loader" aria-label="Loading portfolio">
        <div class="boot-enso-wrap">
          <div class="boot-enso-ring"></div>
          <div class="boot-seal">AJ</div>
        </div>
        <div class="boot-label">SUMMONING GUIDING WIND...</div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
