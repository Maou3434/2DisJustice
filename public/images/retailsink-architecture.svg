<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#080A0F; font-family:'JetBrains Mono', 'Space Grotesk', -apple-system, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161B26" stroke-width="1" />
    </pattern>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C2333" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B13" />
      <stop offset="100%" stop-color="#191210" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2430" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#302613" />
      <stop offset="100%" stop-color="#1C180E" />
    </linearGradient>
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2906" />
      <stop offset="100%" stop-color="#1E1403" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cinnabarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C83226" />
    </marker>
    <marker id="arrowSilver" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B949E" />
    </marker>
  </defs>

  <!-- Background Grids -->
  <rect width="100%" height="100%" fill="#080A0F" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8" />
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6" />

  <!-- Blueprint Header Banner -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="1120" height="42" fill="#0E121B" stroke="#222A3B" stroke-width="1" rx="3" />
    <circle cx="20" cy="21" r="5" fill="#C83226" filter="url(#cinnabarGlow)" />
    <text x="36" y="26" fill="#F6F8FB" font-size="13" font-weight="700" letter-spacing="0.1em">RETAILSINK SYSTEM TOPOLOGY // DELTA LAKEHOUSE &amp; VECTORIZED OLAP</text>
    <text x="890" y="26" fill="#8B949E" font-size="11" letter-spacing="0.08em">MEDALLION ARCHITECTURE · SCD TYPE 2</text>
  </g>

  <!-- COLUMN 1: Ingestion Sources -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="180" height="490" fill="#0C0F17" stroke="#1F2636" stroke-width="1" rx="4" />
    <text x="16" y="32" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.12em">// INGESTION LAYER</text>
    
    <!-- Source 1: Retail POS Stream -->
    <g transform="translate(14, 52)">
      <rect width="152" height="74" fill="#131722" stroke="#263147" stroke-width="1" rx="3" />
      <text x="12" y="24" fill="#F6F8FB" font-size="12" font-weight="600">Retail POS Stream</text>
      <text x="12" y="42" fill="#8B949E" font-size="10">Sub-second Cashdesk Logs</text>
      <rect x="12" y="52" width="60" height="14" fill="#1A2233" rx="2" />
      <text x="18" y="63" fill="#88A4E6" font-size="9">JSON / REST</text>
    </g>

    <!-- Source 2: Inventory Webhook -->
    <g transform="translate(14, 140)">
      <rect width="152" height="74" fill="#131722" stroke="#263147" stroke-width="1" rx="3" />
      <text x="12" y="24" fill="#F6F8FB" font-size="12" font-weight="600">Inventory Sensor IoT</text>
      <text x="12" y="42" fill="#8B949E" font-size="10">RFID Shelf Ingest</text>
      <rect x="12" y="52" width="60" height="14" fill="#1A2233" rx="2" />
      <text x="18" y="63" fill="#88A4E6" font-size="9">MQTT / WSS</text>
    </g>

    <!-- Source 3: User Clickstream -->
    <g transform="translate(14, 228)">
      <rect width="152" height="74" fill="#131722" stroke="#263147" stroke-width="1" rx="3" />
      <text x="12" y="24" fill="#F6F8FB" font-size="12" font-weight="600">Store Analytics Log</text>
      <text x="12" y="42" fill="#8B949E" font-size="10">Session &amp; Cart Events</text>
      <rect x="12" y="52" width="60" height="14" fill="#1A2233" rx="2" />
      <text x="18" y="63" fill="#88A4E6" font-size="9">Apache Kafka</text>
    </g>

    <!-- FastAPI Gateway Ingest Container -->
    <g transform="translate(14, 320)">
      <rect width="152" height="150" fill="#182030" stroke="#C83226" stroke-width="1.5" rx="3" />
      <text x="12" y="24" fill="#C83226" font-size="11" font-weight="700">FastAPI Ingest Hub</text>
      <text x="12" y="44" fill="#F6F8FB" font-size="11">Async Router</text>
      <text x="12" y="62" fill="#8B949E" font-size="10">Pydantic V2 Schemas</text>
      <text x="12" y="80" fill="#8B949E" font-size="10">Backpressure Buffer</text>
      <line x1="12" y1="94" x2="140" y2="94" stroke="#263147" stroke-width="1" />
      <text x="12" y="112" fill="#38BDF8" font-size="10">Throughput:</text>
      <text x="12" y="128" fill="#F6F8FB" font-size="12" font-weight="700">4,200 msg / sec</text>
    </g>
  </g>

  <!-- FLOW ARROWS FROM INGEST TO GATEWAY -->
  <path d="M 166 190 L 190 190 L 190 440 L 166 440" fill="none" stroke="#263147" stroke-width="1.5" />
  <path d="M 220 440 L 268 440" fill="none" stroke="#C83226" stroke-width="2" marker-end="url(#arrowRed)" />

  <!-- COLUMN 2: Delta Lakehouse Medallion Storage Layer -->
  <g transform="translate(270, 100)">
    <rect x="0" y="0" width="360" height="490" fill="#0C0F17" stroke="#1F2636" stroke-width="1" rx="4" />
    <text x="20" y="32" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.12em">// DELTA LAKEHOUSE (MEDALLION ACID STORAGE)</text>

    <!-- BRONZE LAYER -->
    <g transform="translate(18, 52)">
      <rect width="324" height="116" fill="url(#bronzeGrad)" stroke="#6E3B1E" stroke-width="1.2" rx="4" />
      <rect x="12" y="10" width="70" height="18" fill="#522B14" rx="2" />
      <text x="18" y="23" fill="#FDBA74" font-size="10" font-weight="700">BRONZE</text>
      <text x="92" y="24" fill="#F6F8FB" font-size="12" font-weight="600">Raw Append-Only Tables</text>
      <text x="14" y="48" fill="#8B949E" font-size="10">Storage: Immutable Parquet files with JSON commit log</text>
      <text x="14" y="66" fill="#8B949E" font-size="10">Schema: Payload preserving with ingest metadata timestamp</text>
      <rect x="14" y="80" width="130" height="20" fill="#1C1410" stroke="#422513" stroke-width="1" rx="2" />
      <text x="22" y="94" fill="#D97706" font-size="10">ACID Log: _delta_log/</text>
      <rect x="154" y="80" width="156" height="20" fill="#1C1410" stroke="#422513" stroke-width="1" rx="2" />
      <text x="162" y="94" fill="#F97316" font-size="10">Latency: 14ms append</text>
    </g>

    <!-- FLOW ARROW BRONZE -> SILVER -->
    <path d="M 180 168 L 180 196" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)" />
    <text x="194" y="186" fill="#8B949E" font-size="9">Cleansing &amp; Deduplication</text>

    <!-- SILVER LAYER -->
    <g transform="translate(18, 202)">
      <rect width="324" height="124" fill="url(#silverGrad)" stroke="#384358" stroke-width="1.2" rx="4" />
      <rect x="12" y="10" width="70" height="18" fill="#242C3D" rx="2" />
      <text x="22" y="23" fill="#CBD5E1" font-size="10" font-weight="700">SILVER</text>
      <text x="92" y="24" fill="#F6F8FB" font-size="12" font-weight="600">Conformed &amp; Enriched Domain</text>
      <text x="14" y="48" fill="#94A3B8" font-size="10">Enforcement: Null rejection, currency normalization</text>
      <text x="14" y="66" fill="#F59E0B" font-size="10" font-weight="600">SCD Type 2: Historical auditability via valid_from / valid_to</text>
      <rect x="14" y="86" width="140" height="22" fill="#0F141E" stroke="#253047" stroke-width="1" rx="2" />
      <text x="22" y="101" fill="#38BDF8" font-size="10">Z-Order: customer_id</text>
      <rect x="164" y="86" width="146" height="22" fill="#0F141E" stroke="#253047" stroke-width="1" rx="2" />
      <text x="172" y="101" fill="#A7F3D0" font-size="10">Partition: date_trunc('day')</text>
    </g>

    <!-- FLOW ARROW SILVER -> GOLD -->
    <path d="M 180 326 L 180 354" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)" />
    <text x="194" y="344" fill="#8B949E" font-size="9">Rollup Aggregations</text>

    <!-- GOLD LAYER -->
    <g transform="translate(18, 360)">
      <rect width="324" height="114" fill="url(#goldGrad)" stroke="#785A18" stroke-width="1.2" rx="4" />
      <rect x="12" y="10" width="70" height="18" fill="#473612" rx="2" />
      <text x="28" y="23" fill="#FDE047" font-size="10" font-weight="700">GOLD</text>
      <text x="92" y="24" fill="#F6F8FB" font-size="12" font-weight="600">Business Aggregate Marts</text>
      <text x="14" y="48" fill="#8B949E" font-size="10">Granularity: 1-minute velocity metrics, category revenue</text>
      <text x="14" y="66" fill="#8B949E" font-size="10">Format: Compacted Delta tables ready for direct vectorized OLAP</text>
      <rect x="14" y="78" width="180" height="22" fill="#1C180E" stroke="#473612" stroke-width="1" rx="2" />
      <text x="22" y="93" fill="#FACC15" font-size="10">Precomputed Cube Views</text>
    </g>
  </g>

  <!-- FLOW ARROW GOLD -> DUCKDB -->
  <path d="M 630 420 L 678 420" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- COLUMN 3: Vectorized DuckDB Engine -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="240" height="490" fill="url(#duckGrad)" stroke="#B45309" stroke-width="1.5" rx="4" filter="url(#amberGlow)" />
    <text x="18" y="32" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.12em">// COMPUTE ENGINE</text>

    <g transform="translate(16, 52)">
      <!-- DuckDB Badge -->
      <rect width="208" height="60" fill="#181104" stroke="#F59E0B" stroke-width="1.5" rx="3" />
      <text x="16" y="28" fill="#FFF" font-size="18" font-weight="900" letter-spacing="0.06em">DuckDB</text>
      <text x="16" y="46" fill="#FBBF24" font-size="10">Vectorized In-Process OLAP</text>

      <!-- Engine Specs -->
      <rect y="74" width="208" height="170" fill="#140E03" stroke="#5C3A0A" stroke-width="1" rx="3" />
      <text x="14" y="98" fill="#FDE68A" font-size="11" font-weight="700">Execution Kernel:</text>
      <text x="14" y="118" fill="#94A3B8" font-size="10">• SIMD Vectorized Execution</text>
      <text x="14" y="136" fill="#94A3B8" font-size="10">• Push-Down Filter Scan</text>
      <text x="14" y="154" fill="#94A3B8" font-size="10">• Parquet Column Pruning</text>
      <text x="14" y="172" fill="#94A3B8" font-size="10">• Zero-Copy Buffer Zeroing</text>
      <line x1="14" y1="184" x2="194" y2="184" stroke="#3D2606" stroke-width="1" />
      <text x="14" y="202" fill="#38BDF8" font-size="10">Data Interchange:</text>
      <text x="14" y="222" fill="#F6F8FB" font-size="11" font-weight="600">Apache Arrow RecordBatches</text>

      <!-- Performance Metrics Box -->
      <rect y="258" width="208" height="154" fill="#1C1405" stroke="#F59E0B" stroke-width="1" rx="3" />
      <text x="14" y="280" fill="#FBBF24" font-size="11" font-weight="700">BENCHMARK SLA:</text>
      <text x="14" y="302" fill="#94A3B8" font-size="10">10M Row Group Aggregation:</text>
      <text x="14" y="322" fill="#4ADE80" font-size="16" font-weight="800">42.8 ms</text>
      <line x1="14" y1="334" x2="194" y2="334" stroke="#3D2606" stroke-width="1" />
      <text x="14" y="352" fill="#94A3B8" font-size="10">Concurrent OLAP Queries:</text>
      <text x="14" y="372" fill="#38BDF8" font-size="14" font-weight="700">120 QPS @ &lt; 50ms</text>
      <text x="14" y="394" fill="#8B949E" font-size="9">Zero Cloud Compute Bill</text>
    </g>
  </g>

  <!-- FLOW ARROW DUCKDB -> SERVING -->
  <path d="M 920 310 L 968 310" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- COLUMN 4: Presentation & Real-time Serving -->
  <g transform="translate(970, 100)">
    <rect x="0" y="0" width="190" height="490" fill="#0C0F17" stroke="#1F2636" stroke-width="1" rx="4" />
    <text x="16" y="32" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.12em">// SERVING &amp; APPS</text>

    <!-- React Dashboard Card -->
    <g transform="translate(14, 52)">
      <rect width="162" height="190" fill="#131722" stroke="#263147" stroke-width="1" rx="3" />
      <text x="12" y="24" fill="#F6F8FB" font-size="12" font-weight="600">React Analytics UI</text>
      <text x="12" y="42" fill="#8B949E" font-size="10">Dynamic BI Visuals</text>
      
      <!-- Mini Chart Graphic -->
      <path d="M 16 110 L 40 85 L 70 95 L 100 65 L 130 75 L 150 55" fill="none" stroke="#38BDF8" stroke-width="2" />
      <path d="M 16 110 L 40 85 L 70 95 L 100 65 L 130 75 L 150 55 L 150 120 L 16 120 Z" fill="rgba(56, 189, 248, 0.12)" />
      
      <rect x="12" y="132" width="138" height="20" fill="#0B0E17" rx="2" />
      <text x="20" y="146" fill="#38BDF8" font-size="9">Sub-second refresh (SSE)</text>

      <rect x="12" y="158" width="138" height="20" fill="#0B0E17" rx="2" />
      <text x="20" y="172" fill="#4ADE80" font-size="9">P99 Latency: 48ms</text>
    </g>

    <!-- External BI Connectors -->
    <g transform="translate(14, 260)">
      <rect width="162" height="210" fill="#131722" stroke="#263147" stroke-width="1" rx="3" />
      <text x="12" y="24" fill="#F6F8FB" font-size="12" font-weight="600">Downstream APIs</text>
      <text x="12" y="44" fill="#8B949E" font-size="10">• REST Export (JSON/CSV)</text>
      <text x="12" y="64" fill="#8B949E" font-size="10">• Parquet Batch Dumps</text>
      <text x="12" y="84" fill="#8B949E" font-size="10">• Store Reorder Alerts</text>
      <line x1="12" y1="100" x2="150" y2="100" stroke="#263147" stroke-width="1" />
      <text x="12" y="122" fill="#F59E0B" font-size="10" font-weight="600">PRODUCTION STATUS</text>
      <rect x="12" y="136" width="138" height="26" fill="#1A2E1C" stroke="#22C55E" stroke-width="1" rx="2" />
      <text x="24" y="153" fill="#86EFAC" font-size="10" font-weight="700">● 99.98% UPTIME</text>
      <text x="12" y="184" fill="#64748B" font-size="9">Automated CI/CD</text>
      <text x="12" y="198" fill="#64748B" font-size="9">Dockerized Architecture</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(40, 602)">
    <circle cx="6" cy="6" r="4" fill="#D97706" />
    <text x="16" y="10" fill="#94A3B8" font-size="10">Delta Lake Medallion Storage</text>

    <circle cx="210" cy="6" r="4" fill="#F59E0B" />
    <text x="220" y="10" fill="#94A3B8" font-size="10">DuckDB Vectorized OLAP Execution</text>

    <circle cx="450" cy="6" r="4" fill="#38BDF8" />
    <text x="460" y="10" fill="#94A3B8" font-size="10">Apache Arrow In-Memory Columnar Batch</text>

    <circle cx="720" cy="6" r="4" fill="#C83226" />
    <text x="730" y="10" fill="#94A3B8" font-size="10">FastAPI Asynchronous Gateway</text>

    <text x="1000" y="10" fill="#64748B" font-size="10" text-anchor="end">Engineered by Abimanyu Jayaganesh</text>
  </g>
</svg>
