<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" style="background:#08090D; font-family:'Space Mono', monospace;">
  <defs>
    <pattern id="slmGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#151822" stroke-width="1" />
    </pattern>
    <marker id="slmArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C83226" />
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#08090D" />
  <rect width="1200" height="540" fill="url(#slmGrid)" />

  <g transform="translate(36, 28)">
    <rect width="1128" height="44" fill="#101219" stroke="#262A38" rx="3" />
    <circle cx="22" cy="22" r="5" fill="#C83226" />
    <text x="38" y="27" fill="#F5EFE6" font-size="13" font-weight="700" letter-spacing="0.1em">PRIVACY-FIRST SMART HOME ASSISTANT // EDGE SLM–LLM &amp; FORMAL FSM/CDFG ENGINE</text>
    <text x="1108" y="27" fill="#C8C0B2" font-size="11" text-anchor="end">ZERO-CLOUD ROUTINE INFERENCE · HOME ASSISTANT</text>
  </g>

  <g transform="translate(36, 96)">
    <rect width="340" height="404" fill="#0E1017" stroke="#262A38" rx="4" />
    <text x="20" y="30" fill="#C83226" font-size="11" font-weight="700">01 // MULTI-MODAL EDGE SENSING</text>
    <g transform="translate(20, 48)">
      <rect width="300" height="165" fill="#131620" stroke="#252A3A" rx="3" />
      <text x="14" y="26" fill="#F5EFE6" font-size="11" font-weight="700">Real-Time Household Telemetry</text>
      <text x="14" y="50" fill="#C8C0B2" font-size="10">• Occupancy &amp; Spatial Motion Vectors</text>
      <text x="14" y="70" fill="#C8C0B2" font-size="10">• Thermal, Ambient Light &amp; Air Quality</text>
      <text x="14" y="90" fill="#C8C0B2" font-size="10">• Temporal Habit &amp; Appliance Deltas</text>
      <text x="14" y="130" fill="#857E73" font-size="9">Context-Windowing &amp; State Representation</text>
    </g>
    <g transform="translate(20, 230)">
      <rect width="300" height="150" fill="#131620" stroke="#252A3A" rx="3" />
      <text x="14" y="26" fill="#F5EFE6" font-size="11" font-weight="700">Async Producer-Consumer Queues</text>
      <text x="14" y="50" fill="#C8C0B2" font-size="9">Isolates high-frequency sensor acquisition</text>
      <text x="14" y="68" fill="#C8C0B2" font-size="9">from language-model reasoning workloads via</text>
      <text x="14" y="86" fill="#C8C0B2" font-size="9">non-blocking task offloading buffers.</text>
    </g>
  </g>

  <path d="M 376 298 L 418 298" stroke="#C83226" stroke-width="2" marker-end="url(#slmArr)" />

  <g transform="translate(424, 96)">
    <rect width="352" height="404" fill="#161014" stroke="#C83226" stroke-width="1.5" rx="4" />
    <text x="20" y="30" fill="#F5EFE6" font-size="11" font-weight="700">02 // HYBRID FSM + QUANTIZED SLM</text>
    <g transform="translate(20, 48)">
      <rect width="312" height="165" fill="#0B0C10" stroke="#2D2024" rx="3" />
      <text x="16" y="26" fill="#C83226" font-size="11" font-weight="700">Formal Safety &amp; Timing Verification</text>
      <text x="16" y="50" fill="#F5EFE6" font-size="10">• Finite State Machines (FSMs)</text>
      <text x="16" y="72" fill="#F5EFE6" font-size="10">• Control Data Flow Graphs (CDFGs)</text>
      <text x="16" y="94" fill="#C8C0B2" font-size="9">Enforces deterministic safety overrides and</text>
      <text x="16" y="112" fill="#C8C0B2" font-size="9">concurrency bounds over probabilistic AI.</text>
    </g>
    <g transform="translate(20, 230)">
      <rect width="312" height="150" fill="#0B0C10" stroke="#2D2024" rx="3" />
      <text x="16" y="26" fill="#F5EFE6" font-size="11" font-weight="700">Teacher–Student SLM Distillation</text>
      <text x="16" y="50" fill="#C8C0B2" font-size="9">• Quantized Edge SLM for Routine Inference</text>
      <text x="16" y="70" fill="#C8C0B2" font-size="9">• Selective Cloud LLM Fallback for Complex</text>
      <text x="16" y="90" fill="#C8C0B2" font-size="9">• Proactive "If-This-Then-Likely" Engine</text>
      <text x="16" y="122" fill="#C83226" font-size="9" font-weight="700">● 100% Offline Privacy for Core Routines</text>
    </g>
  </g>

  <path d="M 776 298 L 818 298" stroke="#C83226" stroke-width="2" marker-end="url(#slmArr)" />

  <g transform="translate(824, 96)">
    <rect width="340" height="404" fill="#0E1017" stroke="#262A38" rx="4" />
    <text x="20" y="30" fill="#C83226" font-size="11" font-weight="700">03 // ACTUATION &amp; SIMULATION</text>
    <g transform="translate(20, 48)">
      <rect width="300" height="165" fill="#101514" stroke="#52634C" stroke-width="1.5" rx="3" />
      <text x="16" y="28" fill="#F5EFE6" font-size="11" font-weight="700">Home Assistant Bus Integration</text>
      <text x="16" y="54" fill="#C8C0B2" font-size="10">• Bidirectional WebSocket Event Stream</text>
      <text x="16" y="76" fill="#C8C0B2" font-size="10">• REST API Device State Synchronization</text>
      <text x="16" y="98" fill="#C8C0B2" font-size="10">• Personalized Proactive Actuation</text>
    </g>
    <g transform="translate(20, 230)">
      <rect width="300" height="150" fill="#131620" stroke="#252A3A" rx="3" />
      <text x="16" y="26" fill="#F5EFE6" font-size="11" font-weight="700">Accelerated Behavioral Simulator</text>
      <text x="16" y="50" fill="#C8C0B2" font-size="9">Evaluates long-term habit extraction, offline</text>
      <text x="16" y="68" fill="#C8C0B2" font-size="9">reliability, inference latency, and automation</text>
      <text x="16" y="86" fill="#C8C0B2" font-size="9">accuracy across simulated multi-room homes.</text>
    </g>
  </g>
</svg>
